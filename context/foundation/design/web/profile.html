<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrivo — Profil</title>
<link rel="stylesheet" href="../_shared/styles.css">
</head>
<body>

  <div class="navbar">
    <div class="logo"><span class="mark">A</span> Arrivo</div>
    <div class="nav-links">
      <a href="discover.html">Odkrywaj</a>
      <a href="bookings-client.html">Moje rezerwacje</a>
      <a href="profile.html" class="active">Profil</a>
    </div>
    <div class="nav-actions"><div class="avatar avatar-sm">MN</div></div>
  </div>

  <div class="content" style="max-width:600px;">
    <div class="page-head">
      <div>
        <h1>Twój profil</h1>
        <p>Te dane widzi specjalista dopiero po akceptacji rezerwacji</p>
      </div>
      <span class="badge badge-client">Klient</span>
    </div>

    <div class="card">
      <div class="flex items-center gap-4" style="margin-bottom:28px;">
        <div class="avatar-upload">
          <div class="avatar avatar-lg">MN</div>
          <div class="edit-btn">📷</div>
        </div>
        <div>
          <div style="font-weight:700; margin-bottom:2px;">Zdjęcie profilowe</div>
          <div class="text-sm text-muted" style="margin-bottom:8px;">JPG lub PNG, min. 400×400px</div>
          <button class="btn btn-secondary btn-sm">Zmień zdjęcie</button>
        </div>
      </div>

      <div class="two-col">
        <div class="field">
          <label>Imię</label>
          <input type="text" value="Marta">
        </div>
        <div class="field">
          <label>Nazwisko</label>
          <input type="text" value="Nowak">
        </div>
      </div>

      <div class="field">
        <label>Adres e-mail</label>
        <input type="email" value="marta.nowak@przyklad.pl">
      </div>
      <div class="field">
        <label>Telefon</label>
        <input type="text" value="+48 600 000 000">
      </div>
      <div class="field">
        <label>Adres domowy</label>
        <input type="text" value="ul. Kwiatowa 12/3, Warszawa">
        <div class="hint">Widoczny wyłącznie dla specjalisty po zaakceptowaniu rezerwacji</div>
      </div>

      <div class="flex justify-between" style="margin-top:8px;">
        <button class="btn btn-danger-ghost">Usuń konto</button>
        <button class="btn btn-primary">Zapisz zmiany</button>
      </div>
    </div>
  </div>

</body>
</html>
