<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrivo — Logowanie</title>
<link rel="stylesheet" href="../_shared/styles.css">
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-logo"><span class="mark">A</span> Arrivo</div>
      <div class="auth-title">Miło Cię widzieć</div>
      <p class="auth-sub">Zaloguj się do swojego konta</p>

      <div class="field">
        <label>Adres e-mail</label>
        <input type="email" placeholder="ty@przyklad.pl">
      </div>
      <div class="field">
        <label>Hasło</label>
        <input type="password" placeholder="••••••••">
        <div class="hint"><a href="#" style="color:var(--primary); font-weight:600;">Nie pamiętasz hasła?</a></div>
      </div>

      <button class="btn btn-primary btn-block">Zaloguj się</button>

      <div class="auth-divider">lub</div>

      <button class="btn btn-secondary btn-block">Kontynuuj z Google</button>

      <div class="auth-foot">
        Nie masz jeszcze konta? <a href="sign-up.html">Zarejestruj się</a>
      </div>
    </div>
  </div>

</body>
</html>
