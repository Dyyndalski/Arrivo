<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrivo — Wystaw opinię</title>
<link rel="stylesheet" href="../_shared/styles.css">
</head>
<body>

  <div class="navbar">
    <div class="logo"><span class="mark">A</span> Arrivo</div>
    <div class="nav-links">
      <a href="discover.html">Odkrywaj</a>
      <a href="bookings-client.html" class="active">Moje rezerwacje</a>
      <a href="profile.html">Profil</a>
    </div>
    <div class="nav-actions"><div class="avatar avatar-sm">MN</div></div>
  </div>

  <div class="content" style="max-width:520px;">
    <div class="breadcrumb"><a href="bookings-client.html">Moje rezerwacje</a><span class="sep">/</span><span class="current">Opinia</span></div>

    <div class="page-head">
      <div>
        <h1>Jak minęła wizyta?</h1>
        <p>Twoja opinia pomaga innym klientom wybrać dobrego specjalistę</p>
      </div>
    </div>

    <div class="card">
      <div class="flex items-center gap-3" style="margin-bottom:22px;">
        <div class="avatar avatar-md">TN</div>
        <div>
          <div style="font-weight:700;">Tomasz Nowicki</div>
          <div class="text-sm text-muted">Strzyżenie męskie · 12 lipca</div>
        </div>
      </div>

      <div class="field" style="text-align:center;">
        <label style="text-align:center; display:block;">Twoja ocena</label>
        <div style="font-size:36px; letter-spacing:6px; color:var(--warning); margin:12px 0;">★★★★★</div>
      </div>

      <div class="field">
        <label>Komentarz</label>
        <textarea placeholder="Opisz swoje doświadczenie..."></textarea>
      </div>

      <button class="btn btn-primary btn-block">Wyślij opinię</button>
    </div>
  </div>

</body>
</html>
