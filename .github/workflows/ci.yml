name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      # Type errors before style errors. `npm run lint` is type-aware but reports lint rules,
      # not TS compile errors — without this step a type-level contract (e.g. the pl/en message
      # catalog parity in src/lib/i18n) passes CI and fails at runtime instead.
      - run: npm run check
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
